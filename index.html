<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Perfumista">
<meta name="referrer" content="no-referrer">
<title>Perfumista Diário</title>
<script>try{var t=JSON.parse(localStorage.getItem("pd.tema")||'"escuro"');if(t!=="auto")document.documentElement.dataset.theme=t==="claro"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="app/icones/icone-180.png">
<link rel="icon" type="image/png" href="app/icones/icone-192.png">
<link rel="stylesheet" href="app/estilo.css?v=5.1">
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <h1><span class="marca" aria-hidden="true"></span>Perfumista <span>Diário</span></h1>
    <span class="versao" id="versao"></span>
  </div>
</header>
<main id="tela" class="tela" aria-live="polite">
  <p class="carregando">Carregando a coleção…</p>
</main>
<nav class="abas" id="abas" aria-label="Seções">
  <button data-aba="hoje" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoje</button>
  <button data-aba="registrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Registrar</button>
  <button data-aba="colecao"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6v3H9z"/><path d="M8 5h8a3 3 0 0 1 3 3v10a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V8a3 3 0 0 1 3-3Z"/><path d="M8 12h8v5H8z"/></svg>Coleção</button>
  <button data-aba="mercado"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8h14v-8"/><path d="M10 20v-5h4v5"/></svg>Mercado</button>
  <button data-aba="playbook"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>Playbook</button>
  <button data-aba="historico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>Histórico</button>
  <button data-aba="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes</button>
</nav>
<div id="folha"></div>
<script type="module" src="app/main.js?v=5.1"></script>
</body>
</html>
