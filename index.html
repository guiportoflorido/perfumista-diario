<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Perfumista">
<meta name="referrer" content="no-referrer">
<title>Perfumista Diário</title>
<link rel="stylesheet" href="app/estilo.css">
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <h1>Perfumista <span>Diário</span></h1>
    <span class="versao" id="versao"></span>
  </div>
</header>
<main id="tela" class="tela" aria-live="polite">
  <p class="carregando">Carregando a coleção…</p>
</main>
<nav class="abas" id="abas" aria-label="Seções">
  <button data-aba="hoje" aria-current="page"><span class="ic" aria-hidden="true">☀︎</span>Hoje</button>
  <button data-aba="registrar"><span class="ic" aria-hidden="true">✎</span>Registrar</button>
  <button data-aba="colecao"><span class="ic" aria-hidden="true">◫</span>Coleção</button>
  <button data-aba="playbook"><span class="ic" aria-hidden="true">▦</span>Playbook</button>
  <button data-aba="historico"><span class="ic" aria-hidden="true">◷</span>Histórico</button>
  <button data-aba="ajustes"><span class="ic" aria-hidden="true">⚙︎</span>Ajustes</button>
</nav>
<div id="folha"></div>
<script type="module" src="app/main.js"></script>
</body>
</html>
